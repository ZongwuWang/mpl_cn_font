[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpl_cn_font"
version = "0.1.0"
description = "A package to configure Chinese fonts for Matplotlib with ease."
authors = [{ name = "Zongwu Wang", email = "wangzongwu@sjtu.edu.cn" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.6"
dependencies = [
    "matplotlib>=3.0.0"
]

keywords = ["matplotlib", "chinese", "font", "中文", "字体"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]

[tool.setuptools]
packages = ["mpl_cn_font"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
mpl_cn_font = ["fonts/*.ttf"]